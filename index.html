<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04080c" />

    <title><!--@title--></title>
    <meta name="description" content="<!--@description-->" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="<!--@title-->" />
    <meta property="og:description" content="<!--@description-->" />
    <meta property="og:image" content="./poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<!--@title-->" />
    <meta name="twitter:description" content="<!--@description-->" />
    <meta name="twitter:image" content="./poster.jpg" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Precarga solo el primer frame de la variante que realmente se va a usar.
         Sin el `media`, un móvil bajaba el frame de escritorio al pedo, y con
         reduced-motion se bajaba un frame que nunca se dibuja. -->
    <link
      rel="preload"
      as="image"
      href="./frames/desktop/0001.webp"
      fetchpriority="high"
      media="(min-width: 769px) and (prefers-reduced-motion: no-preference)" />
    <link
      rel="preload"
      as="image"
      href="./frames/mobile/0001.webp"
      fetchpriority="high"
      media="(max-width: 768px) and (prefers-reduced-motion: no-preference)" />

    <script type="application/ld+json">
      <!--@jsonld-->
    </script>
  </head>

  <body data-locked="true">
    <a class="skip-link" href="#inicio">Saltar al contenido</a>

    <!-- Fondo: secuencia de frames dibujada en canvas.
         El video fuente (2560x1440) trae 30 keyframes en 26 s, uno cada ~0.9 s:
         atarlo por currentTime trabaría el scrub una vez por segundo de video. -->
    <div class="stage">
      <canvas
        class="stage__canvas"
        id="stage-canvas"
        role="img"
        aria-label="Personas entrenando en el gimnasio: fuerza, natación y cardio"></canvas>
      <img class="stage__poster" src="./poster.jpg" alt="" aria-hidden="true" />
    </div>
    <div class="stage__vignette" aria-hidden="true"></div>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <p class="loader__mark">Level <span>Up</span></p>
      <div class="loader__bar"><div class="loader__fill" id="loader-fill"></div></div>
      <p class="loader__pct"><span id="loader-pct">0</span>% — Preparando</p>
    </div>

    <header class="topbar">
      <a class="brand" href="#inicio">
        <span>Level<span class="brand__up">Up</span></span>
        <span class="brand__suffix">Fitness-GYM</span>
      </a>
    </header>

    <nav aria-label="Progreso por secciones">
      <!--@levels-->
    </nav>

    <main class="track" id="track">
      <!--@sections-->
    </main>

    <a
      class="wa-float"
      id="wa-float"
      href="https://wa.me/573015247218"
      target="_blank"
      rel="noopener"
      aria-label="Escribir por WhatsApp al 301 524 7218">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.47c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.22-.16-.47-.29Z" />

    </a>

    <div class="scroll-hint" id="scroll-hint" aria-hidden="true">
      <span class="scroll-hint__rail"></span>
      <span>Desliza</span>
    </div>

    <noscript>
      <p style="position: relative; z-index: 20; padding: 1rem; background: #04080c; color: #ffffff">
        <!--@noscript-->
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
